# Honeypot Atlas : web tier (Nginx)
# - serves the static frontend from /var/www/atlas
# - reverse-proxies /api/* to the application tier on 127.0.0.1:3000
# Install:  sudo cp deploy/nginx/atlas.conf /etc/nginx/sites-available/atlas
#           sudo ln -sf /etc/nginx/sites-available/atlas /etc/nginx/sites-enabled/atlas
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx
# (If the API runs on another host/container, change the upstream "server" line, e.g. "server api:3000;")

upstream atlas_api {
    server atlas-backend:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers for the frontend (the API tier only adds nosniff)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # ---- API tier ----
    location /api/ {
        proxy_pass http://atlas_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;               # keep the port: the API compares Origin with Host (CSRF check)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # Server-sent events (live refresh): no buffering, long timeout
    location = /api/stream {
        proxy_pass http://atlas_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # ---- Presentation tier (static files) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(?:css|js)$ {
        expires 5m;
    }
}
