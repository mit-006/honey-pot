# Goal: linting JavaScript using ESLint
name: Eslint

on:
  push:
    branches:
      - test

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - name: Code clone
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ESLint
        run: npm install --no-save eslint @eslint/js globals

      - name: Create ESLint config
        run: |
          cat > eslint.config.mjs << 'EOF'
          import js from "@eslint/js";
          import globals from "globals";

          export default [
            { ignores: ["**/node_modules/**", "**/dist/**", "**/build/**"] },
            js.configs.recommended,
            {
              files: ["frontend/**/*.js"],
              languageOptions: {
                ecmaVersion: "latest",
                sourceType: "module",
                globals: { ...globals.browser },
              },
            },
            {
              files: ["backend/**/*.js"],
              languageOptions: {
                ecmaVersion: "latest",
                sourceType: "module",
                globals: { ...globals.node },
              },
            },
          ];
          EOF

      - name: Run frontend ESLint
        run: npx eslint "frontend/**/*.js"

      - name: Run backend ESLint
        run: npx eslint "backend/**/*.js"
