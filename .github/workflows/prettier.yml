# Goal: check the format of code
name: format_checking

on:
    workflow_call:

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install prettier
        run: npm install --no-save prettier

      - name: run prettier
        run: |
          npx prettier --check \
              "backend/**/*.{js,mjs,json}" \
              "frontend/**/*.{js,html,css,json}" \
              "docker-compose.yml" \
              ".github/workflows/*.yml" \
              "README.md"
