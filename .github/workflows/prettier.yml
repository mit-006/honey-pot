# Goal: check the format of code
name: format_checking

on:
    push:
        branches:
            - test
    
jobs:
    prettier:
        runs-on: ubuntu-latest

        steps:
            - name: code checkout
              uses: actions/checkout@v7

            - name: set up node
              uses: actions/setup-node@v4
              with:
                node-version: '22'
            
            - name: install prettier
              run: npm install --no-save prettier

            - name: run prettier
              run:  npx prettier --check "backend/**/*.{js,json,mjs}" "frontend/**/*.{js,html,css}" "database/**/*.sql" "deploy/**/*.conf" "docker-compose.yml" "eslint.config.js" ".github/workflows/*.yml" "README.md"

            