#goal: scan for  secrets in the repository using GitHub's secret scanning feature

name: Secret Scanning

on:
    push:
        branches:
            - test

jobs:
    Secrets-Scanning:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 0

            - name: scan for leaks
              uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}