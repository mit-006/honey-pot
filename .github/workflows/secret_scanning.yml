#goal: scan for  secrets in the repository using GitHub's secret scanning feature

name: Secret Scanning

on:
  push:
    branches:
      - test

jobs:
  Secrets-Scanning:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: scan for leaks tool1
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: scan for leaks tool2
        uses: dortort/betterleaks-action@v0.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Betterleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betterleaks-report
          path: betterleaks-report.sarif
          if-no-files-found: warn
          retention-days: 7
