#goal: scan for  secrets in the repository using GitHub's secret scanning feature

name: Secret Scanning

on:
    workflow_call:

jobs:
  Secrets-Scanning:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: scan for leaks tool1
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: scan for leaks tool2
        uses: dortort/betterleaks-action@a7fd234802174258836b901156ac35c5d692990c
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Betterleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betterleaks-report
          path: betterleaks-report.sarif
          if-no-files-found: warn
          retention-days: 7
